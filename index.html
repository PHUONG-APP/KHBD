    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            var boundFetch = originalFetch.bind(window);
            var currentFetch = boundFetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(newFetch) {
                currentFetch = typeof newFetch === 'function' ? newFetch : boundFetch;
              }
            });
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              try {
                Object.defineProperty(globalThis, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return currentFetch;
                  },
                  set: function(newFetch) {
                    currentFetch = typeof newFetch === 'function' ? newFetch : boundFetch;
                  }
                });
              } catch (e) {}
            }
          }
        } catch (err) {
          // Gracefully fallback
        }
      })();
